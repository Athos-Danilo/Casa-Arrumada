<div class="dashboard-header animate-fade-in-up">
  <div>
    <h2 class="title">Olá, {{ currentUser?.username }}! ✨</h2>
    <p class="subtitle">O que vamos organizar hoje?</p>
  </div>
</div>

<div class="dashboard-grid animate-fade-in-up">
  <!-- Formulário de Nova Tarefa -->
  <div class="glass-panel new-task-panel">
    <h3>Nova Tarefa</h3>
    <div class="input-group">
      <label>Título</label>
      <input type="text" [(ngModel)]="newTaskTitle" placeholder="Ex: Lavar a louça">
    </div>
    <div class="input-group">
      <label>Descrição</label>
      <input type="text" [(ngModel)]="newTaskDesc" placeholder="Detalhes (opcional)">
    </div>
    <div class="input-group">
      <label>Prioridade</label>
      <select class="custom-select" [(ngModel)]="newTaskPriority">
        <option value="NORMAL">Normal (10 pts)</option>
        <option value="HIGH">Alta 🔥 (20 pts)</option>
      </select>
    </div>
    <button class="btn btn-primary mt-2" (click)="addTask()">Adicionar Tarefa</button>
  </div>

  <!-- Lista de Tarefas -->
  <div class="tasks-list">
    <h3>Tarefas Pendentes</h3>
    
    <div *ngIf="pendingTasks().length === 0" class="empty-state">
      <p>Tudo limpo por aqui! 🎉</p>
    </div>

    <div *ngFor="let task of pendingTasks()" class="glass-panel task-card" [class.high-priority]="task.priority === 'HIGH'">
      <div class="task-info">
        <div class="task-header">
          <h4>{{ task.title }}</h4>
          <span class="badge" [ngClass]="task.priority === 'HIGH' ? 'badge-danger' : 'badge-primary'">
            {{ task.priority === 'HIGH' ? '🔥 ALTA' : 'NORMAL' }}
          </span>
        </div>
        <p class="task-desc">{{ task.description }}</p>
        
        <div class="task-footer">
          <span class="task-assignee" *ngIf="task.user">
            Responsável: <strong>{{ task.user.username }}</strong>
          </span>
          <span class="task-unassigned" *ngIf="!task.user">
            Ninguém assumiu ainda
          </span>

          <div class="task-actions">
            <button *ngIf="!task.user" class="btn btn-outline btn-sm" (click)="claim(task.id)">
              ✋ Eu faço!
            </button>
            <button *ngIf="isMyTask(task)" class="btn btn-success btn-sm" (click)="complete(task.id)">
              ✅ Concluir
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
